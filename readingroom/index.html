<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reading room — lucabrando</title>
<meta name="description" content="A small reading room: chapters and long-form pieces, published to be read.">
<meta name="theme-color" content="#0E0D12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0D12'/%3E%3Crect x='14' y='6' width='4' height='20' fill='%23E8C37A'/%3E%3C/svg%3E">
<style>
  :root{
    --ground:#0E0D12;
    --ink:#F3F1EC;
    --muted:rgba(243,241,236,.45);
    --soft:rgba(243,241,236,.72);
    --rule:rgba(243,241,236,.14);
    --light:#E8C37A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--mono);
    display:flex;justify-content:center;
    padding:clamp(28px,6vw,72px) 16px clamp(48px,9vw,96px);
  }
  main{width:100%;max-width:34rem;display:flex;flex-direction:column;gap:clamp(28px,6vw,44px)}
  .top{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .top a{color:inherit;text-decoration:none;transition:color .18s ease}
  .top a:hover,.top a:focus-visible{color:var(--ink)}
  h1{
    margin:0;font-family:var(--serif);font-weight:400;
    font-size:clamp(30px,8vw,46px);letter-spacing:.02em;line-height:1.08;
  }
  .note{
    margin:0;max-width:30rem;font-family:var(--serif);
    font-size:clamp(16px,4vw,18px);line-height:1.7;color:var(--soft);
  }
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  li{border-top:1px solid var(--rule)}
  li:last-child{border-bottom:1px solid var(--rule)}
  li a{
    display:block;padding:1.4em .2em;color:var(--ink);text-decoration:none;
    transition:padding-left .18s ease;
  }
  li a:hover,li a:focus-visible{padding-left:.9em}
  a:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  .kicker{
    display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--light);margin-bottom:.9em;
  }
  .title{
    display:block;font-family:var(--serif);font-size:clamp(20px,5vw,25px);
    letter-spacing:.01em;line-height:1.25;margin-bottom:.45em;
  }
  .meta{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="top"><a href="/">← lucabrando</a></p>
  <h1>Reading room</h1>
  <p class="note">Pieces worth sitting with. Published here to be read whole, in one sitting, without anything asking for your attention on the way.</p>
  <ul>
    <li>
      <a href="/readingroom/solitudine/">
        <span class="kicker">Capitolo</span>
        <span class="title">Solitudine</span>
        <span class="meta">Serena Malaspina · Ogni ferita è una feritoia · Italiano</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>

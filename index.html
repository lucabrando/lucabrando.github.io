<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>lucabrando</title>
<style>
  :root{
    --ground:#0E0D12;
    --ink:#F3F1EC;
    --muted:rgba(243,241,236,.45);
    --rule:rgba(243,241,236,.14);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--mono);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:clamp(24px,6vw,64px);
  }
  main{width:100%;max-width:460px;display:flex;flex-direction:column;gap:clamp(24px,5vw,40px)}
  h1{
    margin:0;font-size:11px;font-weight:400;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);
  }
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  li{border-top:1px solid var(--rule)}
  li:last-child{border-bottom:1px solid var(--rule)}
  a{
    display:flex;align-items:baseline;gap:1em;justify-content:space-between;
    padding:1.1em .2em;color:var(--ink);text-decoration:none;
    font-size:15px;letter-spacing:.02em;transition:padding-left .18s ease,color .18s ease;
  }
  a:hover,a:focus-visible{padding-left:.9em;color:#fff}
  a:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
  a span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}
</style>
</head>
<body>
<main>
  <h1>lucabrando</h1>
  <ul>
    <li><a href="/illegible/">Illegible field mark <span>Animated logo explorer</span></a></li>
  </ul>
</main>
</body>
</html>
